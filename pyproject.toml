[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qflab"
version = "0.1.0"
description = "Python research worker for a Rust NautilusTrader backtester"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
data = ["yfinance==1.7.0", "exchange-calendars==4.13.1", "pandas==3.0.6", "pyarrow==26.0.0"]

[tool.setuptools.packages.find]
include = ["qflab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
