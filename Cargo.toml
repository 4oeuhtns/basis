[package]
name = "qflab-backtest"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
description = "An inspectable NautilusTrader backtest with a Python research boundary"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
nautilus-backtest = "=0.66.0"
nautilus-common = "=0.66.0"
nautilus-core = "=0.66.0"
nautilus-execution = "=0.66.0"
nautilus-model = "=0.66.0"
nautilus-trading = "=0.66.0"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.dev]
debug = 0

[profile.test]
debug = 0
